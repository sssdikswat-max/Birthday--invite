<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Invited to Swati's Birthday!</title>
    <style>
        :root {
            --bg-color: #ffebe3;
            --env-color: #ffbfa3;
            --env-inside: #fca681;
            --shadow: rgba(220, 110, 80, 0.3);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Container to keep everything scaled nicely */
        .container {
            position: relative;
            width: 90%;
            max-width: 380px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Envelope Wrapper */
        .envelope-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }

        /* The Base Envelope */
        .envelope {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--env-color);
            box-shadow: 0 15px 35px var(--shadow);
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            z-index: 2;
        }

        /* Front Bottom Flap */
        .envelope::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            z-index: 3;
            border-left: 190px solid transparent;
            border-right: 190px solid transparent;
            border-bottom: 140px solid var(--env-inside);
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            width: 100%;
        }
        @media(max-width: 420px) {
            .envelope::before {
                border-left-width: calc(100vw * 0.45);
                border-right-width: calc(100vw * 0.45);
                border-bottom-width: 140px;
            }
        }

        /* Side Left Flap */
        .envelope::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            z-index: 4;
            border-top: 140px solid transparent;
            border-bottom: 140px solid transparent;
            border-left: 190px solid var(--env-color);
            border-bottom-left-radius: 6px;
        }
        @media(max-width: 420px) {
            .envelope::after {
                border-left-width: calc(100vw * 0.45);
            }
        }

        /* Side Right Flap */
        .right-flap {
            position: absolute;
            top: 0;
            right: 0;
            z-index: 4;
            border-top: 140px solid transparent;
            border-bottom: 140px solid transparent;
            border-right: 190px solid var(--env-color);
            border-bottom-right-radius: 6px;
        }
        @media(max-width: 420px) {
            .right-flap {
                border-right-width: calc(100vw * 0.45);
            }
        }

        /* Top Lid/Flap */
        .lid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0;
            border-left: 190px solid transparent;
            border-right: 190px solid transparent;
            border-top: 140px solid var(--env-color);
            transform-origin: top;
            transition: transform 0.4s ease-in-out, z-index 0.2s ease-in-out;
            z-index: 5;
        }
        @media(max-width: 420px) {
            .lid {
                border-left-width: calc(100vw * 0.45);
                border-right-width: calc(100vw * 0.45);
                border-top-width: 140px;
            }
        }

        /* Heart Seal */
        .heart-seal {
            position: absolute;
            top: 115px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
            font-size: 32px;
            transition: opacity 0.3s ease;
        }

        /* The Birthday Card Inside */
        .card {
            position: absolute;
            bottom: 10px;
            left: 5%;
            width: 90%;
            height: 90%;
            background: #fff;
            border-radius: 8px;
            z-index: 1;
            transition: transform 0.6s ease-in-out, box-shadow 0.6s ease-in-out;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #fff;
        }

        /* --- Click Active States --- */
        .envelope-wrapper.open .lid {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope-wrapper.open .heart-seal {
            opacity: 0;
            pointer-events: none;
        }

        .envelope-wrapper.open .card {
            transform: translateY(-160px) scale(1.15);
            z-index: 10;
            box-shadow: 0 20px 40px rgba(220, 110, 80, 0.4);
            height: 150%;
        }

        @media(max-width: 420px) {
            .envelope-wrapper.open .card {
                transform: translateY(-140px) scale(1.1);
                height: 160%;
            }
        }
        
        /* Pulse Hint */
        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.15); }
            100% { transform: translateX(-50%) scale(1); }
        }
        .envelope-wrapper:not(.open) .heart-seal {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="envelope-wrapper" onclick="toggleEnvelope()">
            <div class="lid"></div>
            <div class="heart-seal">❤️</div>
            <div class="envelope">
                <div class="right-flap"></div>
            </div>
            <div class="card">
                <img src="1000097555.jpg" alt="Swati's Birthday Invitation">
            </div>
        </div>
    </div>

    <script>
        function toggleEnvelope() {
            const envelope = document.querySelector('.envelope-wrapper');
            envelope.classList.toggle('open');
        }
    </script>

</body>
</html>
